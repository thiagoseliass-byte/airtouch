name: Gerar APK (AIR TOUCH)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir estrutura do projeto
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/airtouch/MainActivity.kt; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo ausente no repositório: $f"
              echo "Envie TODO o conteúdo da pasta airtouch (incluindo a pasta app e suas subpastas)."
              exit 1
            fi
          done
          echo "Estrutura OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de debug (já assinado, instalável)
        run: gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: AirTouch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Testes automáticos dos gestos/mouse. Não impedem a geração do APK.
      - name: Rodar testes unitários
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Guardar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
