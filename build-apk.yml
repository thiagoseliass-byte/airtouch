name: Gerar APK (AIR TOUCH)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir estrutura do projeto
        run: |
          faltando=0
          for f in app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/airtouch/AirTouchViewModel.kt app/src/main/java/com/airtouch/AppTab.kt app/src/main/java/com/airtouch/MainActivity.kt app/src/main/java/com/airtouch/camera/CameraManager.kt app/src/main/java/com/airtouch/control/AirAction.kt app/src/main/java/com/airtouch/control/ControlPipeline.kt app/src/main/java/com/airtouch/control/CustomGesture.kt app/src/main/java/com/airtouch/control/DemoContent.kt app/src/main/java/com/airtouch/control/GestureActionDispatcher.kt app/src/main/java/com/airtouch/control/Profile.kt app/src/main/java/com/airtouch/control/TwoHandZoom.kt app/src/main/java/com/airtouch/detection/HandDetectionEngine.kt app/src/main/java/com/airtouch/docs/PdfController.kt app/src/main/java/com/airtouch/games/GameController.kt app/src/main/java/com/airtouch/gesture/CircleDetector.kt app/src/main/java/com/airtouch/gesture/Gesture.kt app/src/main/java/com/airtouch/gesture/GestureClassifier.kt app/src/main/java/com/airtouch/gesture/GestureRecognitionEngine.kt app/src/main/java/com/airtouch/gesture/SwipeDetector.kt app/src/main/java/com/airtouch/global/AirTouchAccessibilityService.kt app/src/main/java/com/airtouch/global/AirTouchService.kt app/src/main/java/com/airtouch/global/GlobalOverlay.kt app/src/main/java/com/airtouch/model/HandModels.kt app/src/main/java/com/airtouch/mouse/MouseEvent.kt app/src/main/java/com/airtouch/mouse/OneEuroFilter.kt app/src/main/java/com/airtouch/mouse/TouchInjector.kt app/src/main/java/com/airtouch/mouse/VirtualMouse.kt app/src/main/java/com/airtouch/settings/ProfileStore.kt app/src/main/java/com/airtouch/settings/SettingsManager.kt app/src/main/java/com/airtouch/system/SystemActions.kt app/src/main/java/com/airtouch/ui/AirTouchScreen.kt app/src/main/java/com/airtouch/ui/CameraPreview.kt app/src/main/java/com/airtouch/ui/CursorOverlay.kt app/src/main/java/com/airtouch/ui/CustomizeScreen.kt app/src/main/java/com/airtouch/ui/DocumentsScreen.kt app/src/main/java/com/airtouch/ui/GamesScreen.kt app/src/main/java/com/airtouch/ui/GlobalScreen.kt app/src/main/java/com/airtouch/ui/HandOverlay.kt app/src/main/java/com/airtouch/ui/InkOverlay.kt app/src/main/java/com/airtouch/ui/MouseTestArea.kt app/src/main/java/com/airtouch/ui/Panels.kt app/src/main/java/com/airtouch/ui/PdfPageView.kt app/src/main/java/com/airtouch/ui/UiParts.kt app/src/main/java/com/airtouch/ui/WritingScreen.kt app/src/main/java/com/airtouch/ui/theme/Theme.kt app/src/main/java/com/airtouch/writing/AirWriting.kt app/src/main/java/com/airtouch/writing/InkRecognizer.kt app/src/main/java/com/airtouch/writing/ShapeRecognizer.kt app/src/main/res/values/strings.xml app/src/main/res/values/themes.xml app/src/main/res/xml/accessibility_service_config.xml app/src/test/java/com/airtouch/control/ControlPipelineTest.kt app/src/test/java/com/airtouch/control/CustomGestureEngineTest.kt app/src/test/java/com/airtouch/control/GestureActionDispatcherTest.kt app/src/test/java/com/airtouch/control/ProfileTest.kt app/src/test/java/com/airtouch/control/TestHands.kt app/src/test/java/com/airtouch/control/TwoHandZoomTest.kt app/src/test/java/com/airtouch/games/GameControllerTest.kt app/src/test/java/com/airtouch/gesture/CircleDetectorTest.kt app/src/test/java/com/airtouch/gesture/GestureClassifierTest.kt app/src/test/java/com/airtouch/gesture/SwipeDetectorTest.kt app/src/test/java/com/airtouch/mouse/VirtualMouseTest.kt app/src/test/java/com/airtouch/writing/AirWritingTest.kt app/src/test/java/com/airtouch/writing/ShapeRecognizerTest.kt build.gradle.kts settings.gradle.kts; do
            if [ ! -f "$f" ]; then
              echo "ARQUIVO AUSENTE NO REPOSITORIO: $f"
              faltando=1
            fi
          done
          if [ "$faltando" = "1" ]; then
            echo "Envie os arquivos acima (ou todo o conteudo do zip, incluindo subpastas)."
            exit 1
          fi
          echo "Estrutura OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de debug (já assinado, instalável)
        run: gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: AirTouch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Testes automáticos dos gestos/mouse. Não impedem a geração do APK.
      - name: Rodar testes unitários
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Guardar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
