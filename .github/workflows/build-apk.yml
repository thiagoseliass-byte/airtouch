name: Gerar APK (AIR TOUCH)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir estrutura do projeto
        run: |
          echo "--- arquivos no repositório ---"
          find . -path ./.git -prune -o -type f -print | sort | head -100
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/airtouch/MainActivity.kt; do
            if [ ! -f "$f" ]; then
              echo "ERRO: arquivo ausente no repositório: $f"
              echo "Envie TODO o conteúdo da pasta airtouch (incluindo a pasta app e suas subpastas)."
              exit 1
            fi
          done
          echo "--- app/build.gradle.kts (início) ---"
          head -8 app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Listar projetos e tarefas (diagnóstico)
        run: gradle projects --console=plain

      - name: Compilar APK de debug (já assinado, instalável)
        run: gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: AirTouch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
